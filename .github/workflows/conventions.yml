name: Conventions

# A separate workflow lets an edited title or body re-run only this check.
on:
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review]
  merge_group:

# A merge_group run keys on the ref.
concurrency:
  group: conventions-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  conventions:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The sweep walks the whole base to head range.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      # Neither check needs npm ci.
      - name: Commit subjects
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: node scripts/commitmsg.mjs --range "$BASE_SHA..$HEAD_SHA"

      # A merge_group event carries no title or body.
      - name: Pull request title and opening
        if: github.event_name == 'pull_request'
        run: node scripts/prcheck.mjs
