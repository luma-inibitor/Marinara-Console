name: Check

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

concurrency:
  group: check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Nothing in this workflow writes to the repository, so nothing it runs — or
# anything it installs — is given a token that could.
permissions:
  contents: read

# The three tracks are separate jobs rather than one chain: they do not depend
# on each other, so a pull request waits for the slowest one instead of the sum,
# and a red run names the track that is red instead of stopping at the first.
jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run static checks
        run: npm run check:static

  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run check:test

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run check:build

      # The bundle is the artifact a reviewer needs to serve or measure, and it
      # is gone with the runner otherwise. `if-no-files-found: error` because a
      # build that emitted nothing must not upload nothing and read as a pass.
      - name: Upload dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # Required, not advisory: the CSS and copy work queued behind this is exactly
  # what a browser check catches and a unit test does not.
  #
  # Builds its own bundle instead of `needs: build`, which would serialise it
  # behind the slowest of the other three jobs.
  browser:
    name: Browser tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Keyed on the lock file, because the browser build a given
      # @playwright/test wants is pinned by the version in it. A key on the
      # workflow file or on a hand-written version would either miss an upgrade
      # or invalidate the cache for changes that cannot affect it.
      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # chromium-headless-shell (196 MB), not chromium (356 MB). Every project
      # in playwright.config.ts is headless chromium, which is what the shell
      # is; the extra 160 MB buys a headed browser nothing here opens.
      #
      # `--with-deps` still runs on a cache hit, and has to: the cache holds the
      # browser, not the apt packages it links against.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium-headless-shell

      - name: Run browser tests
        run: npm run test:e2e

      # Only on failure, and this is the whole of what a failure leaves behind:
      # the HTML report, plus the trace, screenshot and error context Playwright
      # keeps per failed test. Without it a red run on a hosted runner is a
      # locator name and nothing to look at.
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
