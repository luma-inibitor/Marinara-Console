# Advisory prose linting on pull requests. See README.md.
name: Prose

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

concurrency:
  group: prose-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  vale:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: read
      checks: write  # reviewdog creates the check run the annotations hang on.

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint prose
        uses: vale-cli/vale-action@518a9136acc6e6668ce7c00d367051e0941e87ff # v3.0.0
        with:
          version: "3.18.0"

          # Not github-pr-annotations: GitHub caps a step at 10 annotations
          # and drops the rest silently.
          reporter: github-pr-check

          # Only lines the pull request touches; the corpus has a backlog.
          filter_mode: added

          # Advisory: never blocks a merge.
          fail_on_error: false
          fail_level: none
