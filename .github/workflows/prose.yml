name: Prose

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

concurrency:
  group: prose-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  vale:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: read
      # For the github-pr-check reporter, which creates a check run to hang the
      # annotations on. See the reporter note below for why it is worth the
      # extra scope. reviewdog can create check runs with this and nothing
      # else: it cannot push, merge, or approve.
      checks: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint prose
        uses: vale-cli/vale-action@518a9136acc6e6668ce7c00d367051e0941e87ff # v3.0.0
        with:
          # Pinned rather than "latest", so a Vale release cannot change what
          # this reports without a commit here.
          version: "3.18.0"

          # github-pr-annotations needs no write permission, but GitHub caps a
          # step at 10 annotations and silently drops the rest. That is not a
          # theoretical limit: the commit that added this workflow put 16
          # alerts on its own diff. github-pr-check has no cap, at the cost of
          # `checks: write` above.
          reporter: github-pr-check

          # `added` is the default and the reason for using the action at all:
          # it reports only on lines the pull request touches. The docs carry
          # about 1,600 standing alerts, so a repo-wide report would be noise
          # nobody reads. Run `npm run prose` locally for the full picture.
          filter_mode: added

          # Advisory. Vale returns non-zero purely because some rules are error
          # severity, which says nothing about whether the prose needs work.
          fail_on_error: false
          fail_level: none
