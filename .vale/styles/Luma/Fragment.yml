# A sentence opening with a coordinator or a negator, which is the shape a
# fragment takes when it's written for emphasis rather than for meaning:
# "Not in color, not in absence." or "And never in a toast."
#
# Scoped to the sentence, so the same words mid-sentence are ordinary.
extends: existence
message: "'%s' opens a sentence fragment. Write a complete sentence."
link: https://docs.vale.sh/checks/existence
level: suggestion
scope: sentence
nonword: true
tokens:
  - '^(?:Not|Nor|Neither|And|But|Or|So|Yet|Also|Plus|Hence|Thus)\s+[a-z]'
