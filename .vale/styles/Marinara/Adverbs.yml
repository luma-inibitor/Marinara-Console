# Local additions to Microsoft.Adverbs, which already covers most of the -ly
# hedges. Hand-written rules live outside the synced packages, so `vale sync`
# will not overwrite this file.
#
# 'honestly' is already in Microsoft's token list; these are the ones it misses.
extends: existence
message: "Remove '%s' if it's not important to the meaning of the statement."
link: https://learn.microsoft.com/en-us/style-guide/word-choice/use-simple-words-concise-sentences
ignorecase: true
level: warning
action:
  name: remove
tokens:
  - genuinely
