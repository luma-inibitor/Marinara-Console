# A balanced two-clause construction that lands a point instead of stating a
# fact. DESIGN.md's comment rule names these.
#
# `scope: text`, not `scope: sentence`, and both patterns anchor themselves.
# That was once forced: Vale's code path skips its NLP pipeline, so a
# sentence-scoped rule matched nothing in a .ts file and never said so. The
# `[formats]` mapping in .vale.ini lifts that, and a sentence scope would work
# here now. It stays as it is because both constructions span a semicolon,
# which segmentation would cut in half.
extends: existence
message: "Balanced aphorism ('%s'). State the fact instead."
level: warning
scope: text
nonword: true
tokens:
  # "The cost is one extra build; the saving is the whole of build's wall clock."
  - '\b[Tt]he (?:cost|saving|savings|price|gain|win|loss|benefit|tradeoff|trade) is\b[^;.]{0,70};\s+the \w+ is\b'
  # "It is not a fact about the wire, it is a rule about the model."
  - '\b(?:is|was) not (?:a|an|the) \w+[,;] (?:it|that) (?:is|was) (?:a|an|the)\b'
