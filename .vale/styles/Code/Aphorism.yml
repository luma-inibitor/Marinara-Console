# A balanced two-clause construction that lands a point instead of stating a
# fact. DESIGN.md's comment rule calls these out by name.
#
# `scope: text`, not `scope: sentence`, and that is load-bearing. Vale never
# segments code comments into sentences, so a sentence-scoped rule silently
# matches nothing in a .ts file — it does not error, it just never fires. Any
# rule meant to reach a comment has to anchor itself.
extends: existence
message: "Balanced aphorism ('%s'). State the fact instead."
level: warning
scope: text
nonword: true
tokens:
  # "The cost is one extra build; the saving is the whole of build's wall clock."
  - '\b[Tt]he (?:cost|saving|savings|price|gain|win|loss|benefit|tradeoff|trade) is\b[^;.]{0,70};\s+the \w+ is\b'
  # "It is not a fact about the wire, it is a rule about the model."
  - '\b(?:is|was) not (?:a|an|the) \w+[,;] (?:it|that) (?:is|was) (?:a|an|the)\b'
