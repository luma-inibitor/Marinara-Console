# Prose linting for the Markdown docs. See README.md for the how and the why.

StylesPath = .vale/styles
MinAlertLevel = suggestion

# Pinned: a bare `Microsoft` resolves to whatever is current at sync time.
Packages = https://github.com/vale-cli/Microsoft/releases/download/v0.15.1/Microsoft.zip
Vocab = Luma

[*.md]
BasedOnStyles = Vale, Microsoft, Luma

# Blockquotes carry quoted source material - owner feedback, upstream copy.
# It is evidence, and paraphrasing it to satisfy a style rule destroys it.
BlockIgnores = (?m)^(?: *>.*\n)+

# Off until the corpus stops using spaced em dashes. 298 alerts, 59% of errors.
Microsoft.Dashes = NO

# The backlog is a long, dense running log, revised constantly. Cleaning it up
# is a separate job from standing the linter up.
[BACKLOG.md]
BasedOnStyles =

# Quotes the constructions the rules catch, so it reports about a hundred
# times on itself.
[docs/misc/vale-rhetoric-research.md]
BasedOnStyles =

# Code comments, Code style only: the prose styles report 1,373 identifiers as
# misspellings and 487 quoted symbols. Measured over src/ and scripts/.
[*.{ts,tsx,mjs,js}]
BasedOnStyles = Code
