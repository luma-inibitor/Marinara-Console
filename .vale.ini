# Prose linting for the Markdown docs and the code comments. See README.md for
# the how and the why.

StylesPath = .vale/styles
MinAlertLevel = suggestion

# Pinned: a bare `Microsoft` resolves to whatever is current at sync time.
Packages = https://github.com/vale-cli/Microsoft/releases/download/v0.15.1/Microsoft.zip
Vocab = Luma

# Comments are linted as Markdown rather than as code. That mapping is what
# puts a comment through Vale's NLP pipeline, and the pipeline is what a
# `scope: sentence` rule and a POS-tagged `sequence` rule need to fire at all.
# The code path never calls it. docs/misc/vale-code-comments.md has the
# mechanism, the measurements and the extensions this cannot reach.
[formats]
ts = md
tsx = md
js = md

[*.md]
BasedOnStyles = Vale, Microsoft, Luma

# Off until the corpus stops using spaced em dashes. 298 alerts, 59% of errors.
Microsoft.Dashes = NO

# Long, dense and heavily revised; a separate job from standing the linter up.
[{BACKLOG.md,design/DESIGN.md}]
BasedOnStyles =

# Quotes the constructions the rules catch, so it reports about a hundred
# times on itself.
[docs/misc/vale-rhetoric-research.md]
BasedOnStyles =

# Code comments. Luma joins Code now that the rhetoric rules reach a comment:
# under the mapping above they find 163 alerts across src/ and scripts/ where
# they found 7 before. The prose styles stay off — Microsoft alone puts 1,355
# on src/, and taking that backlog is a separate decision from making the
# rules run.
[*.{ts,tsx,js}]
BasedOnStyles = Code, Luma

# Vendored engine logic. Its comments are upstream's to word.
[src/lib/{lorebook-keyword-matching,regex-safety}.js]
BasedOnStyles =

# Vale has no grammar for .mjs and no entry for it in its extension table, so
# it falls through to linting the whole file — code included — as plain text.
# That is 2,031 alerts on scripts/, 974 of them identifiers read as
# misspellings. Off here; `npm run prosecheck` reaches these files through a
# shim that Vale's own file walk cannot.
[*.{mjs,cjs}]
BasedOnStyles =
