StylesPath = .vale/styles
MinAlertLevel = suggestion

# Pinned to a release rather than the bare name `Microsoft`, which resolves to
# whatever is current at sync time. The style defines the rules, so an upstream
# release would otherwise change what CI reports with no commit here.
Packages = https://github.com/vale-cli/Microsoft/releases/download/v0.15.1/Microsoft.zip
Vocab = Luma

[*.md]
BasedOnStyles = Vale, Microsoft, Luma

# --- Files exempted for now --------------------------------------------------
# The two canonical documents. Both are long, dense and heavily revised, so
# linting them is a separate piece of work from standing the linter up.
[{BACKLOG.md,design/DESIGN.md}]
BasedOnStyles =

# Quotes the constructions the rules catch, so it reports about a hundred
# times on itself.
[docs/misc/vale-rhetoric-research.md]
BasedOnStyles =
