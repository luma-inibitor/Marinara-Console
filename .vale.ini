# Prose linting for the Markdown docs. See README.md for the how and the why.
#
# The rules, the Google and Microsoft pins and the shared vocabulary come from
# the Luma package, luma-inibitor/vale-styles. This file carries only what is
# local to this repo: the package version, the vocabulary and the exemptions.

StylesPath = .vale/styles
MinAlertLevel = suggestion

Packages = https://github.com/luma-inibitor/vale-styles/releases/download/v1.0.0/Luma.zip
Vocab = Marinara

# A severity the package sets in [*.md] turns that rule on for every .md file,
# so an empty BasedOnStyles does not exempt a file by itself. Each exemption
# also switches off, by name, every rule the package gives a severity.

# The backlog is a long, dense running log, revised constantly. Cleaning it up
# is a separate job from standing the linter up.
[BACKLOG.md]
BasedOnStyles =
Google.Parens = NO
Google.Passive = NO
Microsoft.Passive = NO

# Quotes the constructions the rules catch, so it reports about a hundred
# times on itself.
[docs/misc/vale-rhetoric-research.md]
BasedOnStyles =
Google.Parens = NO
Google.Passive = NO
Microsoft.Passive = NO
