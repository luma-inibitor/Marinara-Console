StylesPath = .vale/styles
MinAlertLevel = suggestion

# Pinned to a release rather than the bare name `Microsoft`, which resolves to
# whatever is current at sync time. The style defines the rules, so an upstream
# release would otherwise change what CI reports with no commit here.
Packages = https://github.com/vale-cli/Microsoft/releases/download/v0.15.1/Microsoft.zip
Vocab = Luma

[*.md]
BasedOnStyles = Vale, Microsoft, Luma

# --- Deferred ----------------------------------------------------------------
# The docs write spaced em dashes ("a — b") and Microsoft wants them unspaced
# ("a—b"). That is 298 alerts, 59% of every error in the repo, and the fix
# reads worse in a heading: "CLAUDE.md — Marinara Console" becomes
# "CLAUDE.md—Marinara Console".
#
# Off rather than downgraded because the intent is to fix the corpus and turn
# it back on, not to live with it reporting forever. Until then it would be
# 298 alerts standing between a reader and the ones worth acting on.
Microsoft.Dashes = NO

# --- Files exempted for now --------------------------------------------------
# The two canonical documents. Both are long, dense and heavily revised, so
# linting them is a separate piece of work from standing the linter up.
[{BACKLOG.md,design/DESIGN.md}]
BasedOnStyles =
